# Weft Backend — Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts (relative to this file)
script_location = app/migrations

# Put the backend root on sys.path so `env.py` can `from app.config import settings`.
# Required for the bare `alembic` console script (which CI invokes): a pip console
# script puts its own Scripts/bin directory on sys.path[0], never the working
# directory, so without this the CLI dies with `ModuleNotFoundError: No module
# named 'app'`. `python -m alembic` happens to work without it — do not rely on
# that difference.
prepend_sys_path = .

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for migration revision timestamps
timezone = UTC

# Truncate long revision hashes in filenames
truncate_slug_length = 40

# SQLAlchemy URL — overridden at runtime by env.py using app.config.settings
sqlalchemy.url = postgresql+asyncpg://weft:weft_dev@localhost:5432/weft_dev

[post_write_hooks]
# Lint migration files after generation
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
